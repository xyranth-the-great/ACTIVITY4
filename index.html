<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Lab Asset Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-mark"><span class="dot"></span>LAB-ASSET · Role-Based Access</div>
      <h1>Sign in</h1>
      <p class="lede">Laboratory Asset &amp; Service Management System</p>

      <div class="form-error" id="form-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn" id="submit-btn">Sign in</button>
      </form>

      <div class="auth-foot">
        No account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";
    import { getCurrentUser } from "./js/auth.js";

    const errorEl = document.getElementById("form-error");
    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");

    // Already signed in? Skip straight to the dashboard.
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = "dashboard.html";
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
        return;
      }

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
