<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Lab Asset Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-mark"><span class="dot"></span>LAB-ASSET · Role-Based Access</div>
      <h1>Create account</h1>
      <p class="lede">New accounts start as <strong>Requester</strong>. An Administrator can promote you to Staff or Administrator afterward.</p>

      <div class="form-error" id="form-error"></div>
      <div class="form-success" id="form-success"></div>

      <form id="register-form">
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" minlength="6" required />
          <div class="hint">At least 6 characters.</div>
        </div>
        <button type="submit" class="btn" id="submit-btn">Create account</button>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";

    const errorEl = document.getElementById("form-error");
    const successEl = document.getElementById("form-success");
    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("show");
      successEl.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating…";

      const full_name = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name } }, // read by the handle_new_user() trigger
      });

      if (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
        return;
      }

      if (data.session) {
        window.location.href = "dashboard.html";
        return;
      }

      // Email confirmation is on for this project
      successEl.textContent = "Account created. Check your email to confirm, then sign in.";
      successEl.classList.add("show");
      submitBtn.textContent = "Create account";
      form.reset();
      setTimeout(() => { window.location.href = "index.html"; }, 2200);
    });
  </script>
</body>
</html>
